<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob:; script-src 'self' 'unsafe-eval'; style-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Molly">
  <meta name="theme-color" content="#fff7f2">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <title>Molly</title>
</head>
<body class="locked">
  <section id="launcher" class="launcher">
    <h1>Molly</h1>
    <button id="btnOpenCounter" class="btn-primary btn-launch" type="button">似顏繪人數</button>
  </section>

  <header class="top">
    <div class="project-bar">
      <button id="btnBackMenu" class="btn-small btn-icon" type="button" aria-label="返回選單"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
      <select id="projectSelect" aria-label="切換場次"></select>
      <button id="btnNewProject" class="btn-small btn-icon" type="button" aria-label="新增場次"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13v6M9 16h6"/></svg></button>
      <button id="btnSettings" class="btn-small btn-icon" type="button" aria-label="場次設定"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.42 9.00 L22.31 10.00 L22.31 14.00 L19.42 15.00 L19.36 15.13 L20.70 17.87 L17.87 20.70 L15.13 19.36 L15.00 19.42 L14.00 22.31 L10.00 22.31 L9.00 19.42 L8.87 19.36 L6.13 20.70 L3.30 17.87 L4.64 15.13 L4.58 15.00 L1.69 14.00 L1.69 10.00 L4.58 9.00 L4.64 8.87 L3.30 6.13 L6.13 3.30 L8.87 4.64 L9.00 4.58 L10.00 1.69 L14.00 1.69 L15.00 4.58 L15.13 4.64 L17.87 3.30 L20.70 6.13 L19.36 8.87 Z"/></svg></button>
      <button id="btnDeleteProject" class="btn-small btn-icon danger" type="button" aria-label="刪除此場次"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    </div>
    <div id="statusBar" class="status"></div>
  </header>

  <main id="main">
    <p id="emptyState" class="empty" hidden>還沒有場次，先按上方的日曆圖示建立。</p>
    <h2 id="regularTitle" class="section-title">正取</h2>
    <ul id="regularList" class="cards"></ul>
    <h2 id="waitingTitle" class="section-title waiting" hidden>備取</h2>
    <ul id="waitingList" class="cards"></ul>
  </main>

  <footer class="actions">
    <div id="selectionBar" class="selection-bar" hidden>
      <button id="btnSendSelected" class="btn-send" type="button" disabled>🚀 AirDrop（0）</button>
      <button id="btnSaveSelected" class="btn-save" type="button" disabled>💾 存相簿（0）</button>
      <button id="btnDeleteSelected" class="btn-delete" type="button" aria-label="刪除勾選" disabled><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span class="count">（0）</span></button>
    </div>
    <label class="btn-primary" id="btnAdd"><svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span class="sr-only">新增照片</span>
      <input id="fileInput" class="visually-hidden" type="file" accept="image/*" multiple>
    </label>
  </footer>

  <dialog id="projectDialog">
    <form method="dialog" id="projectForm">
      <h3 id="projectDialogTitle">新增場次</h3>
      <label class="field">場次名稱
        <input name="projectTitle" required maxlength="40" placeholder="11/8 高雄">
      </label>
      <label class="field">目標人數（0~100）
        <input name="maxQuota" type="number" inputmode="numeric" min="0" max="100" value="40" required>
      </label>
      <label class="switch-row"><span>開放備取</span><input name="allowWaitingList" type="checkbox"></label>
      <div id="projectExtra" hidden>
        <p id="storageInfo" class="muted"></p>
        <button type="button" id="btnExportCsv" class="btn-small">匯出名單 CSV</button>
      </div>
      <menu>
        <button type="button" value="cancel" data-close>取消</button>
        <button value="ok" class="btn-primary">儲存</button>
      </menu>
    </form>
  </dialog>

  <dialog id="confirmDialog">
    <form method="dialog">
      <h3>確認人數</h3>
      <ul id="confirmList" class="confirm-list"></ul>
      <p id="aiNote" class="muted"></p>
      <menu>
        <button type="button" id="btnSaveBatch">💾 存到相簿</button>
        <button type="button" value="cancel" data-close>取消</button>
        <button value="ok" class="btn-primary">加入</button>
      </menu>
    </form>
  </dialog>

  <dialog id="passwordDialog">
    <form method="dialog" id="passwordForm">
      <h3>請輸入密碼</h3>
      <label class="field">密碼
        <input id="passwordInput" name="password" type="password" inputmode="numeric" autocomplete="off">
      </label>
      <p id="passwordError" class="error" hidden>密碼錯誤</p>
      <menu>
        <button type="button" value="cancel" data-close>取消</button>
        <button value="ok" class="btn-primary">進入</button>
      </menu>
    </form>
  </dialog>

  <dialog id="previewDialog" class="preview"><img id="previewImg" alt="照片預覽"><form method="dialog"><menu><button value="close">關閉</button></menu></form></dialog>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
